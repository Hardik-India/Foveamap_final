[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "foveamap"
version = "1.0.0"
description = "Adaptive radial 2.5D LiDAR perception research pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
[project.optional-dependencies]
ml = ["torch>=2.2", "onnx>=1.15", "onnxscript>=0.1"]
[project.scripts]
foveamap = "foveamap.__main__:main"
foveamap-api = "foveamap.api:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["foveamap*"]

[tool.setuptools.package-data]
foveamap = ["demo_weights.json", "demo_weights.validation.json"]
